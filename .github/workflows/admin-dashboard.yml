name: Deploy Admin Dashboard

on:
  push:
    branches: ["main"]
    paths:
      - "admin-dashboard/**"
      - ".github/workflows/admin-dashboard.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "admin-dashboard/**"
      - ".github/workflows/admin-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-dashboard-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: admin-dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: admin-dashboard
        run: npm run build

      - name: Add GitHub Pages SPA fallback
        run: cp admin-dashboard/dist/index.html admin-dashboard/dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: admin-dashboard/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
